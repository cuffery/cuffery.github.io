---
layout: default
---

<article class="post">
  <div class="site-wrap">
    <header class="post-header">
      <p class="eyebrow">Writing</p>
      <h1>{{ page.title }}</h1>
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
    <footer class="post-footer">
      <a class="text-link" href="{{ '/' | relative_url }}#writing">Back to writing</a>
    </footer>
  </div>
</article>
